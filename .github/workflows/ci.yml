name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Full history, not the default depth of 1: diagrams-match-detectors.sh
      # compares the commit that last touched each SVG with the one that last
      # touched its PNG. On a shallow clone both resolve to HEAD, so that half
      # of the gate would pass for every push ever made, which is worse than
      # not having it.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.5"
          cache: true
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l .; exit 1)
      - name: vet
        run: go vet ./...
      - name: staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@latest
          staticcheck ./...
      - name: test
        run: go test -race ./...
      - name: build
        run: go build ./...

      # idryx reads an organisation's identity graph and names which of their
      # own agents is dangerous, so its own supply chain is what their security
      # team looks at first. "The source is open" is not an answer to them: it
      # always was. The answer is that they can rebuild the release and get the
      # same bytes, measured 2026-08-05 as
      # 8c968574341f48775e898770e98cb586b620101668b86edec24428612e979a80.
      #
      # CGO_ENABLED=0, -trimpath and -s -w hold it, and any one going missing
      # breaks it in silence.
      - name: a release can be rebuilt byte for byte
        run: ./scripts/reproducible-build.sh

      # A number in a README is a claim with no owner: it is right the day it
      # is written and the suite grows in a commit that never opens the file.
      # On 2026-08-05 four of seven such figures on it-rat.com were found
      # stale against these repositories. This is the same check at the source.
      - name: the README's numbers are true
        run: ./scripts/readme-numbers.sh
      - name: every detector is registered and has a test
        run: ./scripts/detectors-complete.sh

      - name: eBPF is optional and its absence is reported
        run: ./scripts/ebpf-optional.sh

      - name: the diagrams count what exists
        run: ./scripts/diagrams-match-detectors.sh

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.5"
          cache: true
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
      - name: gosec
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          gosec -quiet ./...

  ebpf:
    name: ebpf (build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.5"
          cache: true
      # clang compiles connect.c; llvm provides llvm-strip, which bpf2go
      # shells out to by default to strip DWARF from the compiled object;
      # libbpf-dev provides the <bpf/bpf_helpers.h> and <bpf/bpf_core_read.h>
      # headers connect.c includes (vmlinux.h itself is self-generated below
      # and doesn't need the kernel's own linux-headers package -- that's
      # the point of CO-RE).
      - name: system deps
        run: sudo apt-get update && sudo apt-get install -y clang llvm libbpf-dev
      # bpftool from a static release, not the linux-tools-generic apt
      # package: that package is tied to a specific installed kernel
      # package version and 404s whenever the runner's actual running
      # kernel doesn't match one, e.g. Azure-hosted runners' own
      # backported kernel flavor.
      - name: install bpftool
        run: |
          curl -fsSL -o /tmp/bpftool.tar.gz \
            https://github.com/libbpf/bpftool/releases/download/v7.7.0/bpftool-v7.7.0-amd64.tar.gz
          sudo tar -xzf /tmp/bpftool.tar.gz -C /usr/local/bin bpftool
          sudo chmod +x /usr/local/bin/bpftool
      # Absolute path, not "sudo bpftool": sudo's secure_path can put a
      # runner-image-preinstalled, kernel-version-locked bpftool wrapper
      # ahead of the one just installed above, silently shadowing it.
      - name: regenerate vmlinux.h from this runner's BTF
        run: sudo /usr/local/bin/bpftool btf dump file /sys/kernel/btf/vmlinux format c > internal/ebpfcapture/bpf/vmlinux.h
      - name: go generate (bpf2go) -- catches connect.c/committed-output drift
        run: go generate ./internal/ebpfcapture/...
      - name: build
        run: go build ./...
      - name: vet
        run: go vet ./...

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: idryx
          POSTGRES_PASSWORD: idryx
          POSTGRES_DB: idryx_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.5"
          cache: true
      - name: integration tests
        env:
          DATABASE_URL: postgres://idryx:idryx@localhost:5432/idryx_test?sslmode=disable
        # -p 1: both packages talk to the ONE Postgres service above, and
        # internal/graph's testDB TRUNCATEs it at the start of every test. Run in
        # parallel (the default), that truncate lands in the middle of cmd/idryx's
        # own ingest-then-read, and the failure looks like a bug in the code under
        # test rather than in how it was run.
        run: go test -p 1 -tags integration ./internal/graph/ ./cmd/idryx/
