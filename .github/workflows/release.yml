name: release

on:
  push:
    tags: ["v*"]
  # This workflow runs only on a `v*` tag, so without this trigger its build
  # jobs are proven for the first time by the tag itself. TokenFuse's
  # `v0.4.2` failed exactly that way on 2026-09-02: the tag was the first
  # thing that had ever run its musl step, on a line the step had lost since
  # the day it was written. A pull request that touches this file now builds
  # the binaries and the image below and publishes neither (see the `if:` on
  # each job that does).
  pull_request:
    paths: [".github/workflows/release.yml"]

permissions:
  contents: write
  packages: write

jobs:
  # The binaries, split out of `release` below so a pull request that edits
  # this file compiles every target without needing to cut a tag.
  build:
    name: build binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.0"
          cache: true

      - name: build matrix
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME}"
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            GOOS="${target%/*}"; GOARCH="${target#*/}"
            ext=""; [ "$GOOS" = "windows" ] && ext=".exe"
            # The asset NAME carries no version, deliberately, and putting one back
            # breaks something outside this repository. it-rat.com links straight to
            # https://github.com/TAIPANBOX/idryx/releases/latest/download/<this name>,
            # which resolves only while the name is stable. A version here turns
            # every download link on that site into a 404 at the next tag, silently,
            # and the person who finds out is somebody trying to install this.
            #
            # The version is not lost. It is stamped INTO the binary by
            # -X main.version below, which is where `idryx version` reads it from
            # and the harder of the two places to fake: a filename can be renamed by
            # anyone between us and the reader.
            out="idryx_${GOOS}_${GOARCH}"
            CGO_ENABLED=0 GOOS="$GOOS" GOARCH="$GOARCH" \
              go build -trimpath -ldflags "-s -w -X main.version=${VERSION}" \
              -o "dist/${out}/idryx${ext}" ./cmd/idryx
            if [ "$GOOS" = "windows" ]; then
              (cd dist && zip -qr "${out}.zip" "${out}")
            else
              tar -C dist -czf "dist/${out}.tar.gz" "${out}"
            fi
            rm -r "dist/${out}"
          done
          (cd dist && sha256sum * > SHA256SUMS)

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  release:
    name: create release
    needs: build
    # Never on a pull request: `build` above is what a pull request runs
    # instead, and this job is the one that actually publishes.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist

      # What a stranger verifies, and how (README, "Verify a download"):
      #
      #   cosign verify-blob --bundle SHA256SUMS.sigstore.json \
      #     --certificate-identity https://github.com/TAIPANBOX/idryx/.github/workflows/release.yml@refs/tags/<tag> \
      #     --certificate-oidc-issuer https://token.actions.githubusercontent.com SHA256SUMS
      #   sha256sum -c SHA256SUMS
      #   gh attestation verify <asset> -R TAIPANBOX/idryx
      #
      # Keyless: the certificate names this workflow at this tag, so there is no
      # signing key to leak and nothing to rotate. The SBOMs describe the
      # dependency graph this build was made from; the provenance bundle is also
      # attached as an asset so a release page carries it beside the checksums.
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - name: sign the checksums, keyless
        run: cosign sign-blob --yes --bundle dist/SHA256SUMS.sigstore.json dist/SHA256SUMS
      - name: SBOM of this build, SPDX
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: .
          format: spdx-json
          output-file: dist/sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: SBOM of this build, CycloneDX
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: .
          format: cyclonedx-json
          output-file: dist/sbom.cyclonedx.json
          upload-artifact: false
          upload-release-assets: false
      - name: provenance attestation for every asset
        id: provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - name: the provenance bundle as a release asset too
        run: cp "${{ steps.provenance.outputs.bundle-path }}" dist/provenance.intoto.jsonl

      - name: create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --verify-tag --title "idryx ${GITHUB_REF_NAME}" --generate-notes

  # Proves the Dockerfile itself still builds on a pull request that touches
  # this workflow, before a tag ever reaches it. See `image` below for the
  # job that actually pushes.
  image-build:
    name: build image (no push)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # QEMU is registered but not used for the compile: the Go build cross-
      # compiles from the runner's own architecture (see the Dockerfile's
      # BUILDPLATFORM/TARGETARCH). It is here for the base-image layers, which
      # buildx still resolves per platform.
      - uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: |
            VERSION=${{ github.ref_name }}
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # The image, published from the SAME tag as the binaries above rather than
  # from its own, so "which version am I running" has one answer whether the
  # answer came from a tarball or from a registry. Immutable: no `:latest`, no
  # `:main` (Yurii, 2026-08-02).
  image:
    name: build + push
    # Never on a pull request: image-build above already proves the
    # Dockerfile builds, and this job is the one that actually pushes to GHCR.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read      # a job-level block replaces the workflow's, and checkout needs this
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/idryx
          flavor: latest=false
          tags: |
            type=ref,event=tag
            type=sha,format=short

      - name: Build and push
        id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: |
            VERSION=${{ github.ref_name }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The image is signed by digest and its provenance attested, keyless. A
      # stranger verifies with
      #   cosign verify ghcr.io/taipanbox/idryx:<tag> \
      #     --certificate-identity-regexp '^https://github.com/TAIPANBOX/idryx/\.github/workflows/release\.yml@refs/tags/v' \
      #     --certificate-oidc-issuer https://token.actions.githubusercontent.com
      #   gh attestation verify oci://ghcr.io/taipanbox/idryx:<tag> -R TAIPANBOX/idryx
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - name: sign the image by digest, keyless
        run: cosign sign --yes "ghcr.io/taipanbox/idryx@${{ steps.push.outputs.digest }}"
      - name: provenance attestation for the image
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/taipanbox/idryx
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Say what was published
        run: |
          echo "published:"
          echo "${{ steps.meta.outputs.tags }}" | sed 's/^/  /'
          echo
          echo "platforms: linux/amd64, linux/arm64"
