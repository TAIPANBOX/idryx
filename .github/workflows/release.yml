name: release

on:
  push:
    tags: ["v*"]
  # This workflow runs only on a `v*` tag, so without this trigger its build
  # jobs are proven for the first time by the tag itself. TokenFuse's
  # `v0.4.2` failed exactly that way on 2026-09-02: the tag was the first
  # thing that had ever run its musl step, on a line the step had lost since
  # the day it was written. A pull request that touches this file now builds
  # the binaries and the image below and publishes neither (see the `if:` on
  # each job that does).
  pull_request:
    paths: [".github/workflows/release.yml"]

permissions:
  contents: write
  packages: write

jobs:
  # The binaries, split out of `release` below so a pull request that edits
  # this file compiles every target without needing to cut a tag.
  build:
    name: build binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.0"
          cache: true

      - name: build matrix
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME}"
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            GOOS="${target%/*}"; GOARCH="${target#*/}"
            ext=""; [ "$GOOS" = "windows" ] && ext=".exe"
            # The asset NAME carries no version, deliberately, and putting one back
            # breaks something outside this repository. it-rat.com links straight to
            # https://github.com/TAIPANBOX/idryx/releases/latest/download/<this name>,
            # which resolves only while the name is stable. A version here turns
            # every download link on that site into a 404 at the next tag, silently,
            # and the person who finds out is somebody trying to install this.
            #
            # The version is not lost. It is stamped INTO the binary by
            # -X main.version below, which is where `idryx version` reads it from
            # and the harder of the two places to fake: a filename can be renamed by
            # anyone between us and the reader.
            out="idryx_${GOOS}_${GOARCH}"
            CGO_ENABLED=0 GOOS="$GOOS" GOARCH="$GOARCH" \
              go build -trimpath -ldflags "-s -w -X main.version=${VERSION}" \
              -o "dist/${out}/idryx${ext}" ./cmd/idryx
            if [ "$GOOS" = "windows" ]; then
              (cd dist && zip -qr "${out}.zip" "${out}")
            else
              tar -C dist -czf "dist/${out}.tar.gz" "${out}"
            fi
            rm -r "dist/${out}"
          done
          (cd dist && sha256sum * > SHA256SUMS)

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  release:
    name: create release
    needs: build
    # Never on a pull request: `build` above is what a pull request runs
    # instead, and this job is the one that actually publishes.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --title "idryx ${GITHUB_REF_NAME}" --generate-notes

  # Proves the Dockerfile itself still builds on a pull request that touches
  # this workflow, before a tag ever reaches it. See `image` below for the
  # job that actually pushes.
  image-build:
    name: build image (no push)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # QEMU is registered but not used for the compile: the Go build cross-
      # compiles from the runner's own architecture (see the Dockerfile's
      # BUILDPLATFORM/TARGETARCH). It is here for the base-image layers, which
      # buildx still resolves per platform.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: |
            VERSION=${{ github.ref_name }}
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # The image, published from the SAME tag as the binaries above rather than
  # from its own, so "which version am I running" has one answer whether the
  # answer came from a tarball or from a registry. Immutable: no `:latest`, no
  # `:main` (Yurii, 2026-08-02).
  image:
    name: build + push
    # Never on a pull request: image-build above already proves the
    # Dockerfile builds, and this job is the one that actually pushes to GHCR.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/idryx
          flavor: latest=false
          tags: |
            type=ref,event=tag
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: |
            VERSION=${{ github.ref_name }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Say what was published
        run: |
          echo "published:"
          echo "${{ steps.meta.outputs.tags }}" | sed 's/^/  /'
          echo
          echo "platforms: linux/amd64, linux/arm64"
